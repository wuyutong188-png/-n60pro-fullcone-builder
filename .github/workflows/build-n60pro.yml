name: Build N60 Pro PadavanOnly Full Cone

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "First run validate. Use build only after validation passes."
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - build
      source_ref:
        description: "PadavanOnly branch/tag/commit"
        required: true
        default: "openwrt-24.10-6.6"
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_DIR: immortalwrt

jobs:
  n60pro:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder files
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            libelf-dev libzstd-dev zstd jq time ccache subversion quilt \
            asciidoc help2man intltool libxml-parser-perl xsltproc

      - name: Clone PadavanOnly source
        run: |
          git clone --depth 1 --branch "${{ inputs.source_ref }}" \
            "$SOURCE_REPO" "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Update and install feeds
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare N60 Pro config
        run: |
          bash scripts/prepare-config.sh "$SOURCE_DIR"

      - name: Validate source/config
        run: |
          bash scripts/verify-config.sh "$SOURCE_DIR"

      - name: Save validation files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-validation-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/.config.old
            immortalwrt/feeds.conf.default
            current-router-key-packages.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Download sources
        if: ${{ inputs.mode == 'build' }}
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        if: ${{ inputs.mode == 'build' }}
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify built image
        if: ${{ inputs.mode == 'build' }}
        run: |
          bash scripts/verify-image.sh "$SOURCE_DIR"

      - name: Upload firmware
        if: ${{ inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n60-pro-fullcone-${{ github.run_number }}
          path: |
            immortalwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 14
