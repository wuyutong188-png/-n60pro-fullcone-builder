name: N60 Pro SONiC Full Cone v5

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use validate first. Do not build until validation is reviewed."
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - build
      source_ref:
        description: "PadavanOnly source branch/tag/commit (tested default is pinned)"
        required: true
        default: "ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8"
        type: string
      sonic_ref:
        description: "SONiC Full Cone branch/tag/commit (tested default is pinned)"
        required: true
        default: "4de0643f6b48e7e7d57d768144204ce5d3078c8f"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/n60pro-trigger.txt"

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_DIR: immortalwrt
  SONIC_REPO: https://github.com/mufeng05/openwrt-sonic-fullcone.git
  PINNED_SOURCE_REF: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
  PINNED_SONIC_REF: 4de0643f6b48e7e7d57d768144204ce5d3078c8f
  RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'validate' }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8' }}
  SONIC_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.sonic_ref || '4de0643f6b48e7e7d57d768144204ce5d3078c8f' }}

jobs:
  n60pro:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Effective mode: $RUN_MODE"
          echo "Effective PadavanOnly ref: $SOURCE_REF"
          echo "Effective SONiC ref: $SONIC_REF"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$RUN_MODE" != "validate" ]]; then
            echo "ERROR: file-triggered runs are restricted to validate mode."
            exit 1
          fi

          if [[ "$RUN_MODE" == "build" ]]; then
            [[ "$SOURCE_REF" == "$PINNED_SOURCE_REF" ]] || {
              echo "ERROR: build mode must use tested PadavanOnly commit $PINNED_SOURCE_REF"
              exit 2
            }
            [[ "$SONIC_REF" == "$PINNED_SONIC_REF" ]] || {
              echo "ERROR: build mode must use tested SONiC commit $PINNED_SONIC_REF"
              exit 3
            }
          fi

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            libelf-dev libzstd-dev zstd jq time ccache subversion quilt \
            asciidoc help2man intltool libxml-parser-perl xsltproc \
            autoconf automake autopoint libtool pkg-config

      - name: Clone PadavanOnly source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR"
          git init -q "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          PADAVANONLY_COMMIT="$(git rev-parse HEAD)"
          echo "PADAVANONLY_COMMIT=$PADAVANONLY_COMMIT" | tee -a "$GITHUB_ENV"
          git log -1 --oneline

      - name: Update and install feeds
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone SONiC Full Cone source
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/sonic-fullcone
          cd /tmp/sonic-fullcone
          git remote add origin "$SONIC_REPO"
          git fetch --depth 1 origin "$SONIC_REF"
          git checkout --detach FETCH_HEAD
          SONIC_COMMIT="$(git rev-parse HEAD)"
          echo "SONIC_FULLCONE_COMMIT=$SONIC_COMMIT" | tee -a "$GITHUB_ENV"
          git log -1 --oneline

      - name: Apply complete upstream SONiC Full Cone patchset
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          SRC=/tmp/sonic-fullcone

          test -d target/linux/generic/hack-6.6
          test -f "$SRC/kernel/984-add-sonic-fullcone-support.patch"
          test -f "$SRC/kernel/985-add-sonic-fullcone-to-ipt.patch"
          test -f "$SRC/kernel/986-add-sonic-fullcone-to-nft.patch"

          cp -f "$SRC/kernel/984-add-sonic-fullcone-support.patch" target/linux/generic/hack-6.6/
          cp -f "$SRC/kernel/985-add-sonic-fullcone-to-ipt.patch" target/linux/generic/hack-6.6/
          cp -f "$SRC/kernel/986-add-sonic-fullcone-to-nft.patch" target/linux/generic/hack-6.6/

          mkdir -p package/network/utils/iptables/patches
          cp -f "$SRC/patches/iptables/901-sonic-fullcone.patch" \
            package/network/utils/iptables/patches/

          mkdir -p package/libs/libnftnl/patches
          cp -f "$SRC/patches/libnftnl/001-libnftnl-add-fullcone-expression-support.patch" \
            package/libs/libnftnl/patches/

          NFTNL_MK=package/libs/libnftnl/Makefile
          if ! grep -q '^PKG_FIXUP:=.*autoreconf' "$NFTNL_MK"; then
            awk '!ins && /^include \$\(INCLUDE_DIR\)\/package\.mk/ { print "PKG_FIXUP:=autoreconf"; print ""; ins=1 } { print }' \
              "$NFTNL_MK" > "$NFTNL_MK.tmp"
            mv "$NFTNL_MK.tmp" "$NFTNL_MK"
          fi

          mkdir -p package/network/utils/nftables/patches
          cp -f "$SRC/patches/nftables/002-nftables-add-fullcone-expression-support.patch" \
            package/network/utils/nftables/patches/

          # PadavanOnly already carries its own firewall4 Full Cone integration.
          # Install our compatibility patch from this builder repository.
          install -D -m 0644 "$GITHUB_WORKSPACE/.github/patches/003-sonic-fullcone-range-compat.patch" \
            package/network/config/firewall4/patches/003-sonic-fullcone-range-compat.patch

          if [[ -d package/network/config/firewall ]]; then
            mkdir -p package/network/config/firewall/patches
            cp -f "$SRC/firewall/firewall3/001-sonic-fullcone.patch" \
              package/network/config/firewall/patches/
          fi

          echo "===== APPLIED FULLCONE FILES ====="
          find target/linux/generic/hack-6.6 -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort
          find package/network/utils/iptables/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
          find package/libs/libnftnl/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
          find package/network/utils/nftables/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
          find package/network/config/firewall4/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
         
      - name: Prepare N60 Pro MTK config
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          if [[ -f defconfig/mt7975-ipailna-high-power.config ]]; then
            BASE=defconfig/mt7975-ipailna-high-power.config
          elif [[ -f defconfig/mt7986-ax6000.config ]]; then
            BASE=defconfig/mt7986-ax6000.config
          else
            echo "ERROR: no suitable MT7986 defconfig found"
            exit 20
          fi

          cp -f "$BASE" .config
          echo "Using base config: $BASE"

          set_cfg() {
            local sym="$1" val="$2"
            sed -i -e "/^${sym}=.*/d" -e "/^# ${sym} is not set$/d" .config
            case "$val" in
              y|m) echo "${sym}=${val}" >> .config ;;
              n) echo "# ${sym} is not set" >> .config ;;
              *) echo "invalid config value"; exit 21 ;;
            esac
          }

          set_cfg CONFIG_TARGET_mediatek y
          set_cfg CONFIG_TARGET_mediatek_filogic y
          set_cfg CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro y

          set_cfg CONFIG_PACKAGE_kmod-mt_wifi y
          set_cfg CONFIG_PACKAGE_kmod-warp y
          set_cfg CONFIG_PACKAGE_kmod-mediatek_hnat y
          set_cfg CONFIG_PACKAGE_luci-app-mtwifi-cfg y
          set_cfg CONFIG_PACKAGE_luci-app-turboacc-mtk y
          set_cfg CONFIG_PACKAGE_luci-app-eqos-mtk y
          set_cfg CONFIG_PACKAGE_mtk-smp y
          set_cfg CONFIG_PACKAGE_mtkhqos_util y

          set_cfg CONFIG_PACKAGE_kmod-nft-nat y
          set_cfg CONFIG_PACKAGE_kmod-nft-offload y
          set_cfg CONFIG_PACKAGE_iptables-nft y
          set_cfg CONFIG_PACKAGE_luci-app-openclash y
          set_cfg CONFIG_PACKAGE_luci-theme-argon y
          set_cfg CONFIG_PACKAGE_luci-app-argon-config y
          set_cfg CONFIG_PACKAGE_kmod-pppoe y
          set_cfg CONFIG_PACKAGE_ppp-mod-pppoe y
          set_cfg CONFIG_PACKAGE_kmod-usb3 y
          set_cfg CONFIG_PACKAGE_kmod-usb-storage y
          set_cfg CONFIG_PACKAGE_kmod-usb-storage-uas y

          set_cfg CONFIG_PACKAGE_kmod-mt7915e n
          set_cfg CONFIG_PACKAGE_kmod-mt7986-firmware n
          set_cfg CONFIG_PACKAGE_mt7986-wo-firmware n
          set_cfg CONFIG_PACKAGE_kmod-ipt-fullconenat n
          set_cfg CONFIG_PACKAGE_iptables-mod-fullconenat n
          set_cfg CONFIG_PACKAGE_ip6tables-mod-fullconenat n

          set_cfg CONFIG_PACKAGE_wrtbwmon n
          set_cfg CONFIG_PACKAGE_luci-app-wrtbwmon n
          set_cfg CONFIG_PACKAGE_luci-i18n-wrtbwmon-zh-cn n
          set_cfg CONFIG_PACKAGE_luci-app-passwall n
          set_cfg CONFIG_PACKAGE_luci-i18n-passwall-zh-cn n
          set_cfg CONFIG_PACKAGE_zerotier n
          set_cfg CONFIG_PACKAGE_luci-app-zerotier n
          set_cfg CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn n

          make defconfig

      - name: Decouple TurboACC from legacy FULLCONENAT
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          replace_exact(
              "package/mtk/applications/luci-app-turboacc-mtk/Makefile",
              "\t+kmod-ipt-fullconenat +kmod-fs-btrfs +luci-app-ttyd +kmod-bonding \\\n",
              "\t+kmod-fs-btrfs +luci-app-ttyd +kmod-bonding \\\n",
          )

          replace_exact(
              "package/mtk/applications/luci-app-turboacc-mtk/root/etc/init.d/turboacc",
              '''\n\tlocal fullcone\n\tconfig_get "fullcone" "config" "fullcone" "2"\n\techo "$fullcone" > /proc/sys/net/netfilter/nf_conntrack_nat_mode\n''',
              "\n",
          )

          replace_exact(
              "package/mtk/applications/luci-app-turboacc-mtk/root/etc/uci-defaults/turboacc",
              '\nuci -q set "turboacc.config.fullcone"="2"\n',
              "\n",
          )

          js = Path("package/mtk/applications/luci-app-turboacc-mtk/htdocs/luci-static/resources/view/turboacc.js")
          s = js.read_text()
          replacements = [
              ("""var getFullConeStat = rpc.declare({\n\tobject: 'luci.turboacc',\n\tmethod: 'getFullConeStat',\n\texpect: { '': {} }\n});\n\n""", ""),
              ("""\t\tL.resolveDefault(getFastPathStat(), {}),\n\t\tL.resolveDefault(getFullConeStat(), {}),\n\t\tL.resolveDefault(getTCPCCAStat(), {})\n""",
               """\t\tL.resolveDefault(getFastPathStat(), {}),\n\t\tL.resolveDefault(getTCPCCAStat(), {})\n"""),
              ("""\t\t\t\tvar tds = [ 'fastpath_state', 'fullcone_state', 'tcpcca_state' ];\n""",
               """\t\t\t\tvar tds = [ 'fastpath_state', 'tcpcca_state' ];\n"""),
              ("""\t\t\t\tE('tr', {}, [\n\t\t\t\t\tE('td', { 'width': '33%' }, _('Full Cone NAT')),\n\t\t\t\t\tE('td', { 'id': 'fullcone_state' }, E('em', {}, _('Collecting data...')))\n\t\t\t\t]),\n""", ""),
              ("""\n\t\to = s.option(form.ListValue, 'fullcone', _('Full cone NAT'),\n\t\t\t_('Full cone NAT (NAT1) can improve gaming performance effectively.'));\n\t\to.value('0', _('Disable'))\n\t\to.value('2', _('Boardcom_FULLCONE_NAT'));\n\t\to.default = '0';\n\t\to.rmempty = false;\n""", "\n"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit("Expected TurboACC JS block not found")
              s = s.replace(old, new, 1)
          js.write_text(s)

          rpc = Path("package/mtk/applications/luci-app-turboacc-mtk/root/usr/libexec/rpcd/luci.turboacc")
          s = rpc.read_text()
          old = '\t\t\t\thasXTFULLCONENAT  = fs.access("/lib/modules/" .. boardinfo.kernel .. "/xt_FULLCONENAT.ko"),\n'
          if old not in s:
              raise SystemExit("Expected TurboACC RPC feature line not found")
          s = s.replace(old, "", 1)
          start = s.find("\tgetFullConeStat = {")
          end = s.find("\tgetTCPCCAStat = {", start)
          if start < 0 or end < 0:
              raise SystemExit("Expected TurboACC RPC getFullConeStat block not found")
          s = s[:start] + s[end:]
          rpc.write_text(s)
          PY

          # Re-resolve config after dropping the legacy dependency.
          make defconfig

      - name: Validate N60 Pro config
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          required=(
            'CONFIG_TARGET_mediatek=y'
            'CONFIG_TARGET_mediatek_filogic=y'
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y'
            'CONFIG_PACKAGE_kmod-mt_wifi=y'
            'CONFIG_PACKAGE_kmod-warp=y'
            'CONFIG_PACKAGE_kmod-mediatek_hnat=y'
            'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y'
            'CONFIG_PACKAGE_luci-app-turboacc-mtk=y'
            'CONFIG_PACKAGE_luci-app-eqos-mtk=y'
            'CONFIG_PACKAGE_kmod-nft-nat=y'
            'CONFIG_PACKAGE_iptables-nft=y'
            'CONFIG_PACKAGE_luci-app-openclash=y'
            'CONFIG_PACKAGE_luci-theme-argon=y'
            'CONFIG_PACKAGE_luci-app-argon-config=y'
          )
          for s in "${required[@]}"; do
            grep -Fxq "$s" .config && echo "OK   $s" || { echo "FAIL $s"; exit 30; }
          done

          for s in \
            CONFIG_PACKAGE_kmod-mt7915e=y \
            CONFIG_PACKAGE_kmod-mt7986-firmware=y \
            CONFIG_PACKAGE_mt7986-wo-firmware=y \
            CONFIG_PACKAGE_kmod-ipt-fullconenat=y \
            CONFIG_PACKAGE_iptables-mod-fullconenat=y \
            CONFIG_PACKAGE_ip6tables-mod-fullconenat=y; do
            ! grep -Fxq "$s" .config && echo "OK   not selected: $s" || { echo "FAIL selected: $s"; exit 31; }
          done
     
      - name: Build OpenWrt host tools and toolchain
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          echo "===== BUILD HOST TOOLS ====="
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s

          echo "===== BUILD TOOLCHAIN ====="
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

          echo "===== VERIFY HOST M4 ====="
          test -x staging_dir/host/bin/m4
          ls -l staging_dir/host/bin/m4
          staging_dir/host/bin/m4 --version

          echo "===== VERIFY TOOLCHAIN ====="
          GCC_BIN="$(find staging_dir/toolchain-* -maxdepth 2 -type f -name '*gcc' -print -quit)"
          test -n "$GCC_BIN"
          echo "$GCC_BIN"
     
      - name: Download sources
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Compile kernel Full Cone preflight with diagnostics
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -uo pipefail
          set +e
          make target/linux/compile -j1 V=s 2>&1 | tee ../kernel-fullcone-preflight.log
          rc=${PIPESTATUS[0]}
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo
            echo "===== ROOT-CAUSE HINTS FROM KERNEL LOG ====="
            grep -nEi \
              'patch failed|hunk #[0-9]+ failed|FAILED|error:|fatal:|reject|malformed patch|previously applied|does not apply|No rule to make target' \
              ../kernel-fullcone-preflight.log | tail -n 120 || true
            echo
            echo "Kernel preflight failed with exit code $rc"
            exit "$rc"
          fi

      - name: Compile Full Cone userspace preflight with diagnostics
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -uo pipefail

          compile_one() {
            local target="$1"
            local log="$2"

            set +e
            make "$target" -j1 V=s 2>&1 | tee "../$log"
            rc=${PIPESTATUS[0]}
            set -e

            if [[ "$rc" -ne 0 ]]; then
              echo
              echo "===== ROOT-CAUSE HINTS: $target ====="
              grep -nEi \
                'patch failed|hunk #[0-9]+ failed|FAILED|error:|fatal:|reject|automake|autoreconf|No rule to make target' \
                "../$log" | tail -n 120 || true
              exit "$rc"
            fi
          }

          compile_one package/network/utils/iptables/compile iptables-fullcone.log
          compile_one package/libs/libnftnl/compile libnftnl-fullcone.log
          compile_one package/network/utils/nftables/compile nftables-fullcone.log
          compile_one package/network/config/firewall4/compile firewall4-fullcone.log

      - name: Verify fw4 SONiC range compatibility
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          FW4_DIR="$(find build_dir -maxdepth 2 -type d -name 'firewall4-*' -print -quit)"
          test -n "$FW4_DIR"

          ZONE="$FW4_DIR/root/usr/share/firewall4/templates/zone-fullcone.uc"
          FW4UC="$FW4_DIR/root/usr/share/ucode/fw4.uc"
          test -f "$ZONE"
          test -f "$FW4UC"

          {
            echo "===== FIREWALL4 PREPARED SOURCE ====="
            echo "$FW4_DIR"
            echo "===== ZONE TEMPLATE RANGE RULE ====="
            grep -nF 'let snat_range = "1024-65535";' "$ZONE"
            grep -nF 'fullcone to :{{ snat_range }}' "$ZONE"
            echo "===== RUNTIME PROBE RANGE RULE ====="
            grep -nF 'fullcone to :1024-65535' "$FW4UC"
          } | tee ../fw4-range-compat.log

      - name: Validation summary
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          echo "=========================================="
          echo "VALIDATION PASSED"
          echo "PadavanOnly commit : $PADAVANONLY_COMMIT"
          echo "SONiC Full Cone    : $SONIC_FULLCONE_COMMIT"
          echo "Target             : netcore_n60-pro"
          echo "Wi-Fi stack        : kmod-mt_wifi"
          echo "Acceleration       : WARP + MediaTek HNAT"
          echo "Full Cone          : SONiC kernel/userspace + PadavanOnly fw4 range compatibility"
          echo "=========================================="
          echo "Do NOT flash yet. Review this result first."

      - name: Save validation files and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-fullcone-v5-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/feeds.conf.default
            kernel-fullcone-preflight.log
            iptables-fullcone.log
            libnftnl-fullcone.log
            nftables-fullcone.log
            firewall4-fullcone.log
            fw4-range-compat.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build firmware
        if: ${{ env.RUN_MODE == 'build' }}
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify built firmware and write build manifest
        if: ${{ env.RUN_MODE == 'build' }}
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          OUT=bin/targets/mediatek/filogic
          test -d "$OUT"

          echo "===== BUILD OUTPUT ====="
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          IMAGE="$(find "$OUT" -maxdepth 1 -type f | grep -Ei 'netcore[-_]?n60[-_]?pro.*sysupgrade' | head -n 1 || true)"
          test -n "$IMAGE" || {
            echo "ERROR: Netcore N60 Pro sysupgrade image not found."
            exit 50
          }

          MANIFEST="$OUT/immortalwrt-mediatek-filogic.manifest"
          test -f "$MANIFEST"

          for pkg in iptables-nft luci-app-openclash luci-theme-argon luci-app-argon-config kmod-mt_wifi kmod-warp kmod-mediatek_hnat; do
            grep -Eq "^$pkg([[:space:]]|$)" "$MANIFEST" || {
              echo "ERROR: required package missing from manifest: $pkg"
              exit 51
            }
          done

          for pkg in kmod-ipt-fullconenat iptables-mod-fullconenat ip6tables-mod-fullconenat wrtbwmon luci-app-wrtbwmon luci-app-passwall zerotier; do
            ! grep -Eq "^$pkg([[:space:]]|$)" "$MANIFEST" || {
              echo "ERROR: forbidden package present in manifest: $pkg"
              exit 52
            }
          done

          {
            echo "PadavanOnly commit: $PADAVANONLY_COMMIT"
            echo "SONiC Full Cone commit: $SONIC_FULLCONE_COMMIT"
            echo "Target: netcore_n60-pro"
            echo "Full Cone: SONiC kernel/userspace + PadavanOnly fw4 range compatibility"
            echo "Image: $(basename "$IMAGE")"
            echo
            sha256sum "$IMAGE"
          } | tee "$OUT/CHATGPT-BUILD-INFO.txt"

      - name: Upload firmware
        if: ${{ env.RUN_MODE == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n60-pro-fullcone-v5-${{ github.run_number }}
          path: immortalwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 14
