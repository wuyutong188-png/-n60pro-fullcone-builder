name: Validate N60 Pro Full Cone v3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use validate first. Do not build until validation is reviewed."
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - build
      source_ref:
        description: "PadavanOnly source branch/tag/commit"
        required: true
        default: "openwrt-24.10-6.6"
        type: string
      sonic_ref:
        description: "SONiC Full Cone branch/tag/commit"
        required: true
        default: "master"
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_DIR: immortalwrt
  SONIC_REPO: https://github.com/mufeng05/openwrt-sonic-fullcone.git

jobs:
  n60pro:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "build" && "${{ inputs.sonic_ref }}" == "master" ]]; then
            echo "ERROR: build mode must use a fixed SONiC commit SHA, not master."
            exit 2
          fi

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            libelf-dev libzstd-dev zstd jq time ccache subversion quilt \
            asciidoc help2man intltool libxml-parser-perl xsltproc \
            autoconf automake autopoint libtool pkg-config

      - name: Clone PadavanOnly source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.source_ref }}" "$SOURCE_REPO" "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          echo "PADAVANONLY_COMMIT=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
          git log -1 --oneline

      - name: Update and install feeds
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone SONiC Full Cone source
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/sonic-fullcone
          cd /tmp/sonic-fullcone
          git remote add origin "$SONIC_REPO"
          git fetch --depth 1 origin "${{ inputs.sonic_ref }}"
          git checkout --detach FETCH_HEAD
          SONIC_COMMIT="$(git rev-parse HEAD)"
          echo "SONIC_FULLCONE_COMMIT=$SONIC_COMMIT" | tee -a "$GITHUB_ENV"
          git log -1 --oneline

      - name: Apply complete upstream SONiC Full Cone patchset
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          SRC=/tmp/sonic-fullcone

          test -d target/linux/generic/hack-6.6
          test -f "$SRC/kernel/984-add-sonic-fullcone-support.patch"
          test -f "$SRC/kernel/985-add-sonic-fullcone-to-ipt.patch"
          test -f "$SRC/kernel/986-add-sonic-fullcone-to-nft.patch"

          cp -f "$SRC/kernel/984-add-sonic-fullcone-support.patch" target/linux/generic/hack-6.6/
          cp -f "$SRC/kernel/985-add-sonic-fullcone-to-ipt.patch" target/linux/generic/hack-6.6/
          cp -f "$SRC/kernel/986-add-sonic-fullcone-to-nft.patch" target/linux/generic/hack-6.6/

          mkdir -p package/network/utils/iptables/patches
          cp -f "$SRC/patches/iptables/901-sonic-fullcone.patch" \
            package/network/utils/iptables/patches/

          mkdir -p package/libs/libnftnl/patches
          cp -f "$SRC/patches/libnftnl/001-libnftnl-add-fullcone-expression-support.patch" \
            package/libs/libnftnl/patches/

          NFTNL_MK=package/libs/libnftnl/Makefile
          if ! grep -q '^PKG_FIXUP:=.*autoreconf' "$NFTNL_MK"; then
            awk '!ins && /^include \$\(INCLUDE_DIR\)\/package\.mk/ { print "PKG_FIXUP:=autoreconf"; print ""; ins=1 } { print }' \
              "$NFTNL_MK" > "$NFTNL_MK.tmp"
            mv "$NFTNL_MK.tmp" "$NFTNL_MK"
          fi

          mkdir -p package/network/utils/nftables/patches
          cp -f "$SRC/patches/nftables/002-nftables-add-fullcone-expression-support.patch" \
            package/network/utils/nftables/patches/

          mkdir -p package/network/config/firewall4/patches
          cp -f "$SRC/firewall/firewall4/001-sonic-fullcone.patch" \
            package/network/config/firewall4/patches/

          if [[ -d package/network/config/firewall ]]; then
            mkdir -p package/network/config/firewall/patches
            cp -f "$SRC/firewall/firewall3/001-sonic-fullcone.patch" \
              package/network/config/firewall/patches/
          fi

          if [[ -d feeds/luci/applications/luci-app-firewall ]]; then
            mkdir -p feeds/luci/applications/luci-app-firewall/patches
            cp -f "$SRC/patches/luci-app-firewall/"*.patch \
              feeds/luci/applications/luci-app-firewall/patches/

            ZH_PO=feeds/luci/applications/luci-app-firewall/po/zh_Hans/firewall.po
            if [[ -f "$ZH_PO" ]] && ! grep -q "Fullcone NAT" "$ZH_PO"; then
              cat "$SRC/translations/zh_Hans.po" >> "$ZH_PO"
            fi
          fi

          echo "===== APPLIED FULLCONE FILES ====="
          find target/linux/generic/hack-6.6 -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort
          find package/network/utils/iptables/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
          find package/libs/libnftnl/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
          find package/network/utils/nftables/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true
          find package/network/config/firewall4/patches -maxdepth 1 -type f -iname '*fullcone*' -printf '%f\n' | sort || true

      - name: Prepare N60 Pro MTK config
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          if [[ -f defconfig/mt7975-ipailna-high-power.config ]]; then
            BASE=defconfig/mt7975-ipailna-high-power.config
          elif [[ -f defconfig/mt7986-ax6000.config ]]; then
            BASE=defconfig/mt7986-ax6000.config
          else
            echo "ERROR: no suitable MT7986 defconfig found"
            exit 20
          fi

          cp -f "$BASE" .config
          echo "Using base config: $BASE"

          set_cfg() {
            local sym="$1" val="$2"
            sed -i -e "/^${sym}=.*/d" -e "/^# ${sym} is not set$/d" .config
            case "$val" in
              y|m) echo "${sym}=${val}" >> .config ;;
              n) echo "# ${sym} is not set" >> .config ;;
              *) echo "invalid config value"; exit 21 ;;
            esac
          }

          set_cfg CONFIG_TARGET_mediatek y
          set_cfg CONFIG_TARGET_mediatek_filogic y
          set_cfg CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro y

          set_cfg CONFIG_PACKAGE_kmod-mt_wifi y
          set_cfg CONFIG_PACKAGE_kmod-warp y
          set_cfg CONFIG_PACKAGE_kmod-mediatek_hnat y
          set_cfg CONFIG_PACKAGE_luci-app-mtwifi-cfg y
          set_cfg CONFIG_PACKAGE_luci-app-turboacc-mtk y
          set_cfg CONFIG_PACKAGE_luci-app-eqos-mtk y
          set_cfg CONFIG_PACKAGE_mtk-smp y
          set_cfg CONFIG_PACKAGE_mtkhqos_util y

          set_cfg CONFIG_PACKAGE_kmod-nft-nat y
          set_cfg CONFIG_PACKAGE_kmod-nft-offload y
          set_cfg CONFIG_PACKAGE_luci-app-openclash y
          set_cfg CONFIG_PACKAGE_kmod-pppoe y
          set_cfg CONFIG_PACKAGE_ppp-mod-pppoe y
          set_cfg CONFIG_PACKAGE_kmod-usb3 y
          set_cfg CONFIG_PACKAGE_kmod-usb-storage y
          set_cfg CONFIG_PACKAGE_kmod-usb-storage-uas y

          set_cfg CONFIG_PACKAGE_kmod-mt7915e n
          set_cfg CONFIG_PACKAGE_kmod-mt7986-firmware n
          set_cfg CONFIG_PACKAGE_mt7986-wo-firmware n

          set_cfg CONFIG_PACKAGE_wrtbwmon n
          set_cfg CONFIG_PACKAGE_luci-app-wrtbwmon n
          set_cfg CONFIG_PACKAGE_luci-i18n-wrtbwmon-zh-cn n
          set_cfg CONFIG_PACKAGE_luci-app-passwall n
          set_cfg CONFIG_PACKAGE_luci-i18n-passwall-zh-cn n
          set_cfg CONFIG_PACKAGE_zerotier n
          set_cfg CONFIG_PACKAGE_luci-app-zerotier n
          set_cfg CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn n

          make defconfig

      - name: Validate N60 Pro config
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          required=(
            'CONFIG_TARGET_mediatek=y'
            'CONFIG_TARGET_mediatek_filogic=y'
            'CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n60-pro=y'
            'CONFIG_PACKAGE_kmod-mt_wifi=y'
            'CONFIG_PACKAGE_kmod-warp=y'
            'CONFIG_PACKAGE_kmod-mediatek_hnat=y'
            'CONFIG_PACKAGE_luci-app-mtwifi-cfg=y'
            'CONFIG_PACKAGE_luci-app-turboacc-mtk=y'
            'CONFIG_PACKAGE_luci-app-eqos-mtk=y'
            'CONFIG_PACKAGE_kmod-nft-nat=y'
            'CONFIG_PACKAGE_luci-app-openclash=y'
          )
          for s in "${required[@]}"; do
            grep -Fxq "$s" .config && echo "OK   $s" || { echo "FAIL $s"; exit 30; }
          done

          for s in \
            CONFIG_PACKAGE_kmod-mt7915e=y \
            CONFIG_PACKAGE_kmod-mt7986-firmware=y \
            CONFIG_PACKAGE_mt7986-wo-firmware=y; do
            ! grep -Fxq "$s" .config && echo "OK   not selected: $s" || { echo "FAIL selected: $s"; exit 31; }
          done
     
      - name: Build OpenWrt host tools and toolchain
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail

          echo "===== BUILD HOST TOOLS ====="
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s

          echo "===== BUILD TOOLCHAIN ====="
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s

          echo "===== VERIFY HOST M4 ====="
          test -x staging_dir/host/bin/m4
          ls -l staging_dir/host/bin/m4
          staging_dir/host/bin/m4 --version

          echo "===== VERIFY TOOLCHAIN ====="
          GCC_BIN="$(find staging_dir/toolchain-* -maxdepth 2 -type f -name '*gcc' -print -quit)"
          test -n "$GCC_BIN"
          echo "$GCC_BIN"
     
      - name: Download sources
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Compile kernel Full Cone preflight with diagnostics
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -uo pipefail
          set +e
          make target/linux/compile -j1 V=s 2>&1 | tee ../kernel-fullcone-preflight.log
          rc=${PIPESTATUS[0]}
          set -e

          if [[ "$rc" -ne 0 ]]; then
            echo
            echo "===== ROOT-CAUSE HINTS FROM KERNEL LOG ====="
            grep -nEi \
              'patch failed|hunk #[0-9]+ failed|FAILED|error:|fatal:|reject|malformed patch|previously applied|does not apply|No rule to make target' \
              ../kernel-fullcone-preflight.log | tail -n 120 || true
            echo
            echo "Kernel preflight failed with exit code $rc"
            exit "$rc"
          fi

      - name: Compile Full Cone userspace preflight with diagnostics
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -uo pipefail

          compile_one() {
            local target="$1"
            local log="$2"

            set +e
            make "$target" -j1 V=s 2>&1 | tee "../$log"
            rc=${PIPESTATUS[0]}
            set -e

            if [[ "$rc" -ne 0 ]]; then
              echo
              echo "===== ROOT-CAUSE HINTS: $target ====="
              grep -nEi \
                'patch failed|hunk #[0-9]+ failed|FAILED|error:|fatal:|reject|automake|autoreconf|No rule to make target' \
                "../$log" | tail -n 120 || true
              exit "$rc"
            fi
          }

          compile_one package/libs/libnftnl/compile libnftnl-fullcone.log
          compile_one package/network/utils/nftables/compile nftables-fullcone.log
          compile_one package/network/config/firewall4/compile firewall4-fullcone.log

      - name: Validation summary
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          echo "=========================================="
          echo "VALIDATION PASSED"
          echo "PadavanOnly commit : $PADAVANONLY_COMMIT"
          echo "SONiC Full Cone    : $SONIC_FULLCONE_COMMIT"
          echo "Target             : netcore_n60-pro"
          echo "Wi-Fi stack        : kmod-mt_wifi"
          echo "Acceleration       : WARP + MediaTek HNAT"
          echo "Full Cone          : complete SONiC patchset"
          echo "=========================================="
          echo "Do NOT flash yet. Review this result first."

      - name: Save validation files and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-fullcone-v3-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/feeds.conf.default
            kernel-fullcone-preflight.log
            libnftnl-fullcone.log
            nftables-fullcone.log
            firewall4-fullcone.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build firmware
        if: ${{ inputs.mode == 'build' }}
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload firmware
        if: ${{ inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: netcore-n60-pro-fullcone-v3-${{ github.run_number }}
          path: immortalwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 14
